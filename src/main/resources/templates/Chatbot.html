<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* ========== FLOATING CHATBOT BUTTON ========== */
        .chatbot-toggle {
            position: fixed;
            bottom: 35px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .chatbot-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .chatbot-toggle .icon {
            font-size: 30px;
            color: white;
        }

        /* Badge thông báo */
        .chatbot-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4444;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        /* ========== CHAT WINDOW ========== */
        .chatbot-window {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 380px;
            height: 550px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1001;
            animation: slideIn 0.3s ease;
        }

        .chatbot-window.open {
            display: flex;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        /* Header */
        .chatbot-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .chatbot-header h3 {
            margin: 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chatbot-header .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .chatbot-header .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        /* Chat Box */
        .chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Scrollbar */
        .chatbot-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chatbot-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chatbot-messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }

        /* Message */
        .chat-message {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .chat-message.user {
            justify-content: flex-end;
        }

        .chat-message.bot {
            justify-content: flex-start;
        }

        .chat-message-content {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 15px;
            line-height: 1.4;
            font-size: 14px;
            word-wrap: break-word;
        }

        .chat-message.user .chat-message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-message.bot .chat-message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 8px;
            font-size: 14px;
        }

        .chat-message.user .message-avatar {
            order: 2;
        }

        /* Typing indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            background: white;
            border-radius: 15px;
            width: fit-content;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: #999;
            border-radius: 50%;
            animation: typingAnim 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingAnim {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-8px);
            }
        }

        /* Input Area */
        .chatbot-input {
            padding: 12px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 8px;
        }

        .chatbot-input input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }

        .chatbot-input input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .chatbot-input button {
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: transform 0.2s;
        }

        .chatbot-input button:hover {
            transform: scale(1.02);
        }

        /* Quick questions */
        .quick-questions {
            padding: 8px 12px;
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .quick-q {
            padding: 4px 10px;
            background: #f0f0f0;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            color: #666;
        }

        .quick-q:hover {
            background: #667eea;
            color: white;
        }

        /* Message formatting */
        .chat-message-content ul, .chat-message-content ol {
            margin: 6px 0;
            padding-left: 18px;
        }

        .chat-message-content li {
            margin: 3px 0;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .chatbot-window {
                width: calc(100vw - 40px);
                right: 20px;
                left: 20px;
                height: 500px;
            }
        }
    </style>
</head>
<body>

<!-- Floating Chatbot Button -->
<div class="chatbot-toggle" id="chatbotToggle">
<span class="icon">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
        <path
                d="M8 10H16M8 14H13M21 12C21 16.4183 16.9706 20 12 20C10.5308 20 9.14382 19.6872 7.91993 19.1314L3 20L4.02265 16.5907C3.3824 15.2786 3 13.6912 3 12C3 7.58172 7.02944 4 12 4C16.9706 4 21 7.58172 21 12Z"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
        />
    </svg>
</span>    <span class="chatbot-badge" id="chatbotBadge" style="display: none;">1</span>
</div>

<!-- Chat Window -->
<div class="chatbot-window" id="chatbotWindow">
    <div class="chatbot-header" id="chatbotHeader">
        <h3>
            👕 Bé Yêu Shop
            <span class="status-dot"></span>
        </h3>
        <button class="close-btn" id="closeChat">✕</button>
    </div>

    <div class="chatbot-messages" id="chatbotMessages">
        <div class="chat-message bot">
            <div class="message-avatar">🤖</div>
            <div class="chat-message-content">
                Chào bạn! Mình là Bé Yêu Shop 🎀<br><br>
                Mình có thể giúp gì cho bạn hôm nay?
            </div>
        </div>
    </div>

    <div class="quick-questions" id="quickQuestions">
        <button class="quick-q" data-question="Bạn có sản phẩm gì?">📋 Sản phẩm</button>
        <button class="quick-q" data-question="Áo khoác trẻ em giá bao nhiêu?">💰 Giá áo khoác</button>
        <button class="quick-q" data-question="Quần áo bé trai 3-5 tuổi">👦 Bé trai</button>
        <button class="quick-q" data-question="Đồ cho bé gái">👧 Bé gái</button>
    </div>

    <div class="chatbot-input">
        <input type="text" id="chatbotInput" placeholder="Nhập câu hỏi..." onkeypress="handleChatKeyPress(event)">
        <button id="sendBtn">Gửi</button>
    </div>
</div>

<script>
    // DOM elements
    const toggleBtn = document.getElementById('chatbotToggle');
    const chatWindow = document.getElementById('chatbotWindow');
    const closeBtn = document.getElementById('closeChat');
    const header = document.getElementById('chatbotHeader');
    const messagesContainer = document.getElementById('chatbotMessages');
    const input = document.getElementById('chatbotInput');
    const sendBtn = document.getElementById('sendBtn');
    const badge = document.getElementById('chatbotBadge');
    const quickBtns = document.querySelectorAll('.quick-q');

    // State
    let isOpen = false;
    let isTyping = false;

    // Scroll to bottom
    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Format reply
    function formatReply(text) {
        let formatted = text.replace(/^[•\-*]\s(.+)$/gm, '<li>$1</li>');
        if (formatted.includes('<li>')) {
            formatted = formatted.replace(/(<li>.*?<\/li>\n?)+/gs, '<ul>$&</ul>');
        }
        formatted = formatted.replace(/\n/g, '<br>');
        formatted = formatted.replace(/(<br>)+/g, '<br>');
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');
        return formatted;
    }

    // Add message
    function addMessage(text, isUser) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `chat-message ${isUser ? 'user' : 'bot'}`;

        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.textContent = isUser ? '👤' : '🤖';

        const content = document.createElement('div');
        content.className = 'chat-message-content';

        if (isUser) {
            content.textContent = text;
        } else {
            content.innerHTML = formatReply(text);
        }

        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);

        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
    }

    // Show/hide typing
    function showTyping() {
        if (isTyping) return;
        isTyping = true;

        const typingDiv = document.createElement('div');
        typingDiv.className = 'chat-message bot';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = `
            <div class="message-avatar">🤖</div>
            <div class="chat-message-content">
                <div class="typing-indicator active">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        `;
        messagesContainer.appendChild(typingDiv);
        scrollToBottom();
    }

    function hideTyping() {
        isTyping = false;
        const typing = document.getElementById('typingIndicator');
        if (typing) typing.remove();
    }

    // Send message to API
    async function sendMessage(message) {
        if (!message.trim()) return;

        // Clear input
        input.value = '';

        // Add user message
        addMessage(message, true);

        // Show typing
        showTyping();

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            hideTyping();
            addMessage(data.reply, false);

            // Update badge (hide after first interaction)
            badge.style.display = 'none';

        } catch (error) {
            hideTyping();
            addMessage('Xin lỗi, có lỗi xảy ra. Vui lòng thử lại sau! 😊', false);
            console.error('Error:', error);
        }
    }

    // Handle send button
    function handleSend() {
        const message = input.value.trim();
        if (message) {
            sendMessage(message);
        }
    }

    // Handle enter key
    function handleChatKeyPress(event) {
        if (event.key === 'Enter') {
            handleSend();
        }
    }

    // Toggle chat window
    function toggleChat() {
        if (isOpen) {
            chatWindow.style.animation = 'slideOut 0.2s ease';
            setTimeout(() => {
                chatWindow.classList.remove('open');
                chatWindow.style.animation = '';
            }, 200);
            isOpen = false;
        } else {
            chatWindow.classList.add('open');
            isOpen = true;
            input.focus();
            // Hide badge when opened
            badge.style.display = 'none';
        }
    }

    // Event listeners
    toggleBtn.addEventListener('click', toggleChat);
    closeBtn.addEventListener('click', toggleChat);
    sendBtn.addEventListener('click', handleSend);

    // Quick question buttons
    quickBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const question = btn.getAttribute('data-question');
            input.value = question;
            handleSend();
        });
    });

    // Focus input when window opens
    chatWindow.addEventListener('transitionend', () => {
        if (isOpen) {
            input.focus();
        }
    });

    // Show badge after 2 seconds (simulate new message)
    setTimeout(() => {
        if (!isOpen) {
            badge.style.display = 'flex';
        }
    }, 2000);
</script>

</body>
</html>
