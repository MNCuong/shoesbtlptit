<!-- http://localhost:5173/payment-return -->
<!DOCTYPE html>
<html>
<head>
    <title>Kết quả thanh toán</title>
</head>
<body>
<div id="result"></div>
<script>
    // Lấy params từ URL
    const urlParams = new URLSearchParams(window.location.search);

    // Gọi API backend để xử lý
    fetch(`http://localhost:8080/api/vnpay/vnpay_return?${urlParams.toString()}`)
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                document.getElementById('result').innerHTML = `
                        <h1>✅ Thanh toán thành công!</h1>
                        <p>Mã giao dịch: ${data.transactionNo}</p>
                        <p>Số tiền: ${data.amount.toLocaleString('vi-VN')}đ</p>
                    `;
            } else {
                document.getElementById('result').innerHTML = `
                        <h1>❌ Thanh toán thất bại</h1>
                        <p>${data.message}</p>
                    `;
            }
        });
</script>
</body>
</html>
