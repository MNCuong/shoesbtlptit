<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-box {
            background: #fff;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.6s ease-in-out;
        }

        .error-code {
            font-size: 100px;
            font-weight: 700;
            color: #ff4d4f;
            margin-bottom: 10px;
        }

        .error-title {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .error-message {
            color: #666;
            margin-bottom: 30px;
        }

        .btn-home {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            transition: 0.3s;
        }

        .btn-home:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="error-box">

    <div class="error-code" th:text="${status} ?: '500'">500</div>

    <div class="error-title" th:text="${error} ?: 'Something went wrong'">
        Something went wrong
    </div>

    <div class="error-message" th:text="${message} ?: 'An unexpected error occurred.'">
        Error message
    </div>

    <a href="/login" class="btn btn-home">🏠 Về trang chủ</a>

</div>

</body>
</html>
